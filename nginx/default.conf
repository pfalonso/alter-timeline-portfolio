server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Datos personales: se buscan primero en el directorio montado (/usr/share/nginx/userdata),
    # después en la ruta del contrato (html/data/life.json, por si se monta el fichero suelto).
    # Si no hay ninguno → 404 y el cliente cae a life.example.json con el aviso "datos de ejemplo".
    location = /data/life.json {
        root /usr/share/nginx;
        try_files /userdata/life.json /html/data/life.json =404;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
